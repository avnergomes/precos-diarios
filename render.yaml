services:
  # Backend API Service
  # autoDeploy: true is intentional — each daily commit from the GitHub Actions
  # data-update bot triggers a Render redeploy, which picks up the freshly
  # committed JSON/CSV files without any ETL running inside the build.
  - type: web
    name: precos-diarios-api
    runtime: python
    region: oregon
    plan: free
    repo: https://github.com/avnergomes/precos-diarios
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.app_v2:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: API_KEY_FREE
        sync: false
      - key: API_KEY_BASIC
        sync: false
      - key: API_KEY_PRO
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
    autoDeploy: true
    healthCheckPath: /
