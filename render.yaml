services:
  # Backend API Service
  - type: web
    name: precos-diarios-api
    runtime: python
    region: oregon
    plan: free
    repo: https://github.com/avnergomes/precos-diarios
    buildCommand: |
      pip install -r requirements.txt
      python -c "from api.scraper import scrape_latest_quotations; scrape_latest_quotations()" || true
      python api/etl_regional.py || true
      python api/preprocess_data.py || true
    startCommand: gunicorn api.app_v2:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: API_KEY_FREE
        sync: false
      - key: API_KEY_BASIC
        sync: false
      - key: API_KEY_PRO
        sync: false
    autoDeploy: true
    healthCheckPath: /
