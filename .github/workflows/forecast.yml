name: Update Forecasts

on:
  schedule:
    - cron: '0 6 * * 1'  # Segundas às 6h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate forecasts
        run: python scripts/generate_forecasts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dashboard/public/data/forecasts dashboard/public/data/forecast_products.json
          git diff --cached --quiet || (git commit -m "chore: update forecasts [skip ci]" && git push)
