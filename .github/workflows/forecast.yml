name: Update Forecasts

on:
  schedule:
    - cron: '0 6 * * 1'  # Segundas às 6h UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # required by createWorkflowDispatch (deploy.yml trigger)

# Serializa com o data-pipeline: ambos rodam generate_forecasts.py e dao push
# na main. Sem isso, execucoes sobrepostas colidem no push.
concurrency:
  group: "data-pipeline"
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate forecasts
        run: python scripts/generate_forecasts.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dashboard/public/data/forecasts dashboard/public/data/forecast_products.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update forecasts [skip ci]"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy workflow
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // Retry: concurrent dispatches from data-pipeline.yml can transiently 409/500.
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'deploy.yml',
                  ref: 'main'
                });
                core.info(`deploy.yml dispatched (attempt ${attempt})`);
                return;
              } catch (err) {
                core.warning(`dispatch attempt ${attempt} failed: ${err.status} ${err.message}`);
                if (attempt === 3) throw err;
                await new Promise(r => setTimeout(r, 5000 * attempt));
              }
            }
