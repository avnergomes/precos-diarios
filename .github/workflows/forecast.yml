name: Update Forecasts

on:
  schedule:
    # Segundas as ~5:43 UTC. Minuto nao-redondo reduz filas; intencao original era 6h UTC.
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # required by createWorkflowDispatch (deploy.yml trigger)

# Serializa com o data-pipeline: ambos rodam generate_forecasts.py e dao push
# na main. Sem isso, execucoes sobrepostas colidem no push.
concurrency:
  group: "data-pipeline"
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate forecasts
        run: python scripts/generate_forecasts.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dashboard/public/data/forecasts dashboard/public/data/forecast_products.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update forecasts [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                echo "::notice::Push succeeded on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Push failed after 3 attempts."
                exit 1
              fi
              echo "::warning::Push attempt $attempt failed, retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            done
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy workflow
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Retry: concurrent dispatches from data-pipeline.yml can transiently 409/500.
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'deploy.yml',
                  ref: 'main'
                });
                core.info(`deploy.yml dispatched (attempt ${attempt})`);
                return;
              } catch (err) {
                core.warning(`dispatch attempt ${attempt} failed: ${err.status} ${err.message}`);
                if (attempt === 3) throw err;
                await new Promise(r => setTimeout(r, 5000 * attempt));
              }
            }
