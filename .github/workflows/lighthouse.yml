name: Lighthouse CI

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://avnergomes.github.io/precos-diarios/
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          # Runner compartilhado tem variacao alta: medicoes de FCP na mesma
          # versao do site variaram 4391ms e 4682ms. Tres execucoes e mediana
          # evitam reprovar por ruido de amostra unica. Isto corrige a medicao,
          # nao afrouxa o budget, que segue em 4000ms/15000ms.
          runs: 3
