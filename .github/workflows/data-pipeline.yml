name: Data Pipeline - Scrape & Update

on:
  schedule:
    # Runs Mon-Fri at ~15:17 UTC (12:17 BRT). Minuto nao-redondo reduz
    # filas no GitHub Actions; intencao original era ~16 UTC.
    - cron: '17 15 * * 1-5'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild of JSONs and forecasts even without new data'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: "data-pipeline"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental update
        id: update
        run: |
          set +e
          python scripts/update_data.py
          rc=$?
          set -e
          # 0 = new data, 2 = clean run with nothing new, anything else = real failure.
          case "$rc" in
            0) echo "has_changes=true"  >> $GITHUB_OUTPUT ;;
            2) echo "has_changes=false" >> $GITHUB_OUTPUT
               echo "::notice::No new SIMA data published today." ;;
            *) echo "::error::update_data.py failed (exit $rc)"; exit "$rc" ;;
          esac

      - name: Force rebuild (if requested)
        if: github.event.inputs.force_rebuild == 'true' && steps.update.outputs.has_changes == 'false'
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from api.preprocess_data import main as preprocess
          preprocess()
          "
          python -c "
          import shutil; from pathlib import Path
          src = Path('data/json'); dst = Path('dashboard/public/data')
          dst.mkdir(parents=True, exist_ok=True)
          [shutil.copy2(f, dst / f.name) for f in src.glob('*.json')]
          "
          python scripts/generate_forecasts.py

      - name: Install dev dependencies and run tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests -q

      - name: Check for changes
        id: check
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update data [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git; then
              echo "::notice::Push succeeded on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Push attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Trigger deploy workflow
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Retry: concurrent dispatches from forecast.yml can transiently 409/500 (seen 2026-07-20).
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'deploy.yml',
                  ref: 'main'
                });
                core.info(`deploy.yml dispatched (attempt ${attempt})`);
                return;
              } catch (err) {
                core.warning(`dispatch attempt ${attempt} failed: ${err.status} ${err.message}`);
                if (attempt === 3) throw err;
                await new Promise(r => setTimeout(r, 5000 * attempt));
              }
            }
