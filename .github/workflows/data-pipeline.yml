name: Data Pipeline - Scrape & Update

on:
  schedule:
    # Runs Mon-Fri at 16:00 UTC (13:00 BRT)
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild of JSONs and forecasts even without new data'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: "data-pipeline"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental update
        id: update
        run: |
          set +e
          python scripts/update_data.py
          rc=$?
          set -e
          # 0 = new data, 2 = clean run with nothing new, anything else = real failure.
          case "$rc" in
            0) echo "has_changes=true"  >> $GITHUB_OUTPUT ;;
            2) echo "has_changes=false" >> $GITHUB_OUTPUT
               echo "::notice::No new SIMA data published today." ;;
            *) echo "::error::update_data.py failed (exit $rc)"; exit "$rc" ;;
          esac

      - name: Force rebuild (if requested)
        if: github.event.inputs.force_rebuild == 'true' && steps.update.outputs.has_changes == 'false'
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from api.preprocess_data import main as preprocess
          preprocess()
          "
          python -c "
          import shutil; from pathlib import Path
          src = Path('data/json'); dst = Path('dashboard/public/data')
          dst.mkdir(parents=True, exist_ok=True)
          [shutil.copy2(f, dst / f.name) for f in src.glob('*.json')]
          "
          python scripts/generate_forecasts.py
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update data [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Trigger deploy workflow
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Retry: concurrent dispatches from forecast.yml can transiently 409/500 (seen 2026-07-20).
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'deploy.yml',
                  ref: 'main'
                });
                core.info(`deploy.yml dispatched (attempt ${attempt})`);
                return;
              } catch (err) {
                core.warning(`dispatch attempt ${attempt} failed: ${err.status} ${err.message}`);
                if (attempt === 3) throw err;
                await new Promise(r => setTimeout(r, 5000 * attempt));
              }
            }
