name: Link Check

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      # O lychee precisa checar o site construido, nao o fonte. O Vite copia
      # dashboard/public/* para a raiz do dist/, entao referencias como
      # "./favicon.svg" e "./i18n/i18n-switcher.css" so existem apos o build.
      # Checando o fonte, este workflow falhava em 100% das execucoes com dois
      # falsos positivos.
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      # O Vite usa base '/precos-diarios/', entao o HTML gerado referencia
      # "/precos-diarios/assets/...". O lychee resolve links root-relative
      # contra --root-dir, logo espelhamos o dist sob esse mesmo prefixo para
      # que os caminhos absolutos batam com o disco.
      - name: Stage built site under its base path
        run: |
          rm -rf _linkcheck
          mkdir -p _linkcheck/precos-diarios
          cp -r dashboard/dist/. _linkcheck/precos-diarios/

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429,503
            --root-dir "${{ github.workspace }}/_linkcheck"
            --exclude "^mailto:"
            --exclude "^https://script.google.com"
            --exclude "^https://www.linkedin.com"
            --exclude "^https://(www\\.)?planalto\\.gov\\.br"
            --exclude-path node_modules
            --exclude-path dashboard/node_modules
            --timeout 30
            "./_linkcheck/precos-diarios/**/*.html"
            "./README.md"
            "./SEO_REPORT.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
