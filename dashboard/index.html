    <!-- Datageo Hub Banner — convite não bloqueante ao hub.
         Substitui o antigo "referer gate", que expulsava acessos diretos
         (favoritos, links compartilhados e visitantes vindos de buscadores)
         e contradizia o SEO do painel. -->
    <script>
      (function () {
        var KEY = 'dg_hub_banner_dismissed';
        try { if (localStorage.getItem(KEY) === '1') return; } catch (e) {}
        var refHost = '';
        try { refHost = new URL(document.referrer || '').hostname; } catch (e) {}
        // Quem já navega dentro do ecossistema não precisa do convite
        if (refHost === location.hostname || refHost === 'datageoparana.github.io') return;

        function mount() {
          if (!document.body) return;
          var bar = document.createElement('div');
          bar.setAttribute('role', 'region');
          bar.setAttribute('aria-label', 'Datageo Paran\u00e1');
          bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:10px 16px;background:#14110c;color:#f1e9d6;font:14px/1.4 "IBM Plex Sans",system-ui,sans-serif;box-shadow:0 -2px 8px rgba(0,0,0,.25)';
          var span = document.createElement('span');
          span.textContent = 'Este painel faz parte do ecossistema Datageo Paran\u00e1.';
          var a = document.createElement('a');
          a.href = 'https://datageoparana.github.io/?from=' + encodeURIComponent(location.hostname + location.pathname);
          a.textContent = 'Conhecer o hub';
          a.style.cssText = 'color:#e0b850;font-weight:600;text-decoration:underline;white-space:nowrap';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Fechar');
          btn.textContent = '\u00d7';
          btn.style.cssText = 'background:none;border:0;color:#f1e9d6;font-size:20px;line-height:1;cursor:pointer;padding:0 4px';
          btn.onclick = function () {
            try { localStorage.setItem(KEY, '1'); } catch (e) {}
            bar.parentNode && bar.parentNode.removeChild(bar);
          };
          bar.appendChild(span);
          bar.appendChild(a);
          bar.appendChild(btn);
          document.body.appendChild(bar);

          // Empilha acima do banner LGPD quando ele estiver visível, para que
          // texto e botão "Entendi" continuem visíveis e clicáveis.
          function stackAboveLgpd() {
            var lg = document.getElementById('lgpd-banner');
            var visible = lg && lg.style.display !== 'none' && lg.offsetHeight > 0;
            bar.style.bottom = visible ? lg.offsetHeight + 'px' : '0';
          }
          stackAboveLgpd();
          window.addEventListener('resize', stackAboveLgpd);
          window.addEventListener('load', stackAboveLgpd);
          var lg = document.getElementById('lgpd-banner');
          var lgBtn = lg ? lg.querySelector('button') : null;
          if (lgBtn) {
            lgBtn.addEventListener('click', function () {
              setTimeout(stackAboveLgpd, 0);
            });
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', mount);
        } else {
          mount();
        }
      })();
    </script>

    <!-- Analytics Tracking Script - Dados anonimizados (Art. 12 LGPD) -->
    <script>
    (function() {
      var TRACKING_URL = '%VITE_TRACKING_URL%';
      if (!TRACKING_URL || TRACKING_URL.indexOf('VITE_TRACKING_URL') !== -1) {
        console.warn('[Tracking] URL not configured - tracking disabled');
        return;
      }

      function getDeviceType() {
        var ua = navigator.userAgent;
        if (/tablet|ipad|playbook|silk/i.test(ua)) return 'Tablet';
        if (/Mobile|Android|iPhone|iPod|webOS|BlackBerry|Opera Mini|IEMobile/i.test(ua)) return 'Mobile';
        return 'Desktop';
      }

      function getConnectionType() {
        if (navigator.connection) {
          return navigator.connection.effectiveType || 'unknown';
        }
        return 'unknown';
      }

      function getUTMParams() {
        var params = new URLSearchParams(window.location.search);
        return {
          utmSource: params.get('utm_source') || '',
          utmMedium: params.get('utm_medium') || '',
          utmCampaign: params.get('utm_campaign') || '',
          utmTerm: params.get('utm_term') || '',
          utmContent: params.get('utm_content') || ''
        };
      }

      function initTracking() {
        try {
          var loadTime = 0;
          var navEntry = window.performance && window.performance.getEntriesByType ? window.performance.getEntriesByType('navigation')[0] : null;
          if (navEntry) {
            loadTime = Math.round(navEntry.loadEventEnd);
          }

          var utmParams = getUTMParams();

          // Campos anonimizados - sem IP, cookies ou fingerprint (Art. 12 LGPD)
          var data = {
            origin: window.location.origin,
            timestamp: new Date().toISOString(),
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            timezoneOffset: new Date().getTimezoneOffset(),
            page: window.location.href,
            pathname: window.location.pathname,
            referrer: document.referrer || '',
            pageTitle: document.title,
            language: navigator.language,
            deviceType: getDeviceType(),
            screenOrientation: screen.orientation ? screen.orientation.type : 'unknown',
            connectionType: getConnectionType(),
            loadTime: loadTime > 0 ? loadTime : '',
            utmSource: utmParams.utmSource,
            utmMedium: utmParams.utmMedium,
            utmCampaign: utmParams.utmCampaign,
            utmTerm: utmParams.utmTerm,
            utmContent: utmParams.utmContent,
            prefersColorScheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          };

          fetch(TRACKING_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(data)
          }).then(function() {
            console.log('[Tracking] Data sent (anonymous)');
          }).catch(function(err) {
            console.warn('[Tracking] Error:', err);
          });
        } catch (e) {
          console.warn('[Tracking] Exception:', e);
        }
      }

      // Tracking dispara sempre - dados anonimizados nao exigem consentimento
      if (document.readyState === 'complete') {
        setTimeout(initTracking, 100);
      } else {
        window.addEventListener('load', function() { setTimeout(initTracking, 100); });
      }
    })();
    </script>
